<html>
	<head>
		<title>OptMeOut - Redirecting...</title>
		<script type="text/javascript">

			let locales = [ [[LANGUAGE_CODES]] ];
			let locale = navigator.language;
			locale = locale.replace("-", "_")
			if (!locales.includes(locale)) {
				locale = '/en_GB/?section=splash'
			}
			window.location.href = locale;

		</script>
	</head>
<body>
	Redirecting to your locale... When not redirected, please visit the <a href="/en_GB/?section=splash">English website</a>.
</body>
</html>
