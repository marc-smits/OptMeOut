# .github/workflows/build-and-deploy.yml
name: Build with Docker Compose & Deploy via SFTP

on:
  push:
    branches: [build_pipeline]

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Disable man_db updates (it slows down the build)
        run: echo "set man-db/auto-update false" | sudo debconf-communicate && sudo dpkg-reconfigure man-db

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Test LFTP installation
        run: lftp --version && which lftp

      - name: Build with Docker Compose
        run: cd docker && chmod +x build.sh buildall.sh && ./build.sh && cd ..

      - name: Deploy via SFTP
        run: LFTP_PASSWORD="${{ secrets.SITE_PASSWORD }}" lftp --env-password sftp://${{ secrets.SITE_USERNAME }}@${{ secrets.SITE_SERVER }} -e "lcd dist_html; mirror -R . .; bye"
