server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10M;

  # Proxy all /api requests to phpApi container
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://phpApi/api/;
  }

  # Proxy all /dev requests to react dev container (disabled, use http://localhost:5173 directly)
  # location /dev/ {
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_pass http://react:5173/;
  # }

  # Serve everything else from static html root
  location / {
    try_files $uri $uri/ /index.html;
  }
}
