services:
  generate:
    image: python:3.14
    working_dir: /build
    command: sh -c "python build.py"
    restart: "no"
    volumes:
      - ..:/build:delegated

  install:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && chmod -R 0777 *"
    restart: "no"
    volumes:
      - ../src/react:/app:cached
      - node_modules:/app/node_modules

  build:
    image: node:20-alpine
    working_dir: /build
    command: sh -c "docker/buildall.sh"
    restart: "no"
    volumes:
      - ..:/build:delegated
      - node_modules:/node_modules
    depends_on:
      generate:
        condition: service_completed_successfully
      install:
        condition: service_completed_successfully

  phpApi:
    image: php:8.4-apache
    ports:
      - "8080:80"
    volumes:
      - ../phpApi:/var/www/html:cached
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/api.php"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  react:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --debug"
    ports:
      - "5173:5173"
    volumes:
      - ../dist/en_GB:/app:cached
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      phpApi:
        condition: service_healthy
      build:
        condition: service_completed_successfully

  web:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:cached
      - ../dist_html:/usr/share/nginx/html:cached
    depends_on:
      phpApi:
        condition: service_healthy
      build:
        condition: service_completed_successfully

volumes:
  node_modules:
