services:
  generate:
    image: python:3.14
    working_dir: /build
    command: sh -c "python build.py"
    restart: "no"
    volumes:
      - ..:/build:delegated

  install_fe:
    image: node:24-alpine
    working_dir: /build
    command: sh -c "npm ci && chmod -R 0777 *"
    restart: "no"
    volumes:
      - ../src/react:/build:cached
      - node_modules:/build/node_modules

  install_be:
    image: composer:latest
    working_dir: /build
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
    command: >
      sh -c "case \"$ENVIRONMENT\" in
        production|staging|development) composer install --no-progress -o --no-dev ;;
        *) composer install ;;
      esac && chmod -R 0777 *"
    restart: "no"
    volumes:
      - ../phpApi/api:/build:delegated

  build:
    image: node:24-alpine
    working_dir: /build
    command: sh -c "chmod +x docker/node-build-all-locales.sh && docker/node-build-all-locales.sh"
    restart: "no"
    volumes:
      - ..:/build:delegated
      - node_modules:/node_modules
    depends_on:
      generate:
        condition: service_completed_successfully
      install_fe:
        condition: service_completed_successfully
      install_be:
        condition: service_completed_successfully

  phpApi:
    image: php:8.4-apache
    ports:
      - "8080:80"
    volumes:
      - ../phpApi:/var/www/html:cached
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/api.php"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    depends_on:
      install_be:
        condition: service_completed_successfully

  react:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --debug"
    ports:
      - "5173:5173"
    volumes:
      - ../dist/en_GB:/app:cached
      - ../src/react/src:/app/src
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      phpApi:
        condition: service_healthy
      build:
        condition: service_completed_successfully

  web:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:cached
      - ../dist_html:/usr/share/nginx/html:cached
    depends_on:
      phpApi:
        condition: service_healthy
      build:
        condition: service_completed_successfully

volumes:
  node_modules:
